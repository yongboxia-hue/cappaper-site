<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>支持 · CapPaper</title><link rel="icon" href="assets/icon.png"><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><a class="brand" href="index.html"><img src="assets/icon.png" alt="">CapPaper</a><nav><a href="privacy.html">隐私政策</a><a href="en/support.html">English</a></nav></header><span class="eyebrow">使用支持</span><h1>我们来帮你。</h1><section class="card"><h2>如何添加报告？</h2><p>打开“报告”页，点击拍摄按钮，或从相册导入。可以连续拍摄多页，确认后保存。</p></section><section class="card"><h2>如何找回报告？</h2><p>通过“家人”页按人浏览，或使用底部搜索查找姓名、医院和报告文字。</p></section><section class="card"><h2>换机之前要做什么？</h2><p>报告保存在本机。请先确认 iPhone 备份或从“文件”App 导出所需资料，再迁移设备。</p></section><section class="card"><h2>反馈与联系</h2><p>在 App 的“我的”页点击“反馈”，或发送邮件至 <a href="mailto:yongboxia@icloud.com">yongboxia@icloud.com</a>。请勿在初次联系时发送完整病历，先描述问题即可。</p></section><footer><span>© 2026 CapPaper</span><span><a href="index.html">首页</a> · <a href="privacy.html">隐私政策</a></span></footer></main></body></html>
